<script>
/* حارس تسجيل الدخول: لو مفيش مستخدم مسجّل يرجّعك لصفحة login.html */
(function () {
  var CFG = {
    apiKey: "AIzaSyDEDLvC4wKI9_HX7WUG6th4zuUOwxxB54k",
    authDomain: "kora-e220c.firebaseapp.com",
    databaseURL: "https://kora-e220c-default-rtdb.firebaseio.com",
    projectId: "kora-e220c",
    storageBucket: "kora-e220c.firebasestorage.app",
    messagingSenderId: "535044321885",
    appId: "1:535044321885:web:b89615d5eb01a93e1613b4"
  };
  window.KoraAuth = { user: null };

  function toLogin() {
    var p = location.pathname.split('/').pop();
    location.replace('login.html' + (p && p !== 'index.html' ? '?next=' + encodeURIComponent(p) : ''));
  }
  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  }

  try {
    if (!firebase.apps.length) firebase.initializeApp(CFG);
  } catch (e) { toLogin(); return; }

  var timer = setTimeout(toLogin, 10000);
  firebase.auth().onAuthStateChanged(function (u) {
    clearTimeout(timer);
    if (!u) { toLogin(); return; }
    window.KoraAuth.user = u;
    document.documentElement.classList.remove('auth-pending');
    ready(function () {
      var name = u.displayName || (u.email ? u.email.split('@')[0] : '') || 'لاعب';
      document.querySelectorAll('[data-user-name]').forEach(function (el) { el.textContent = name; });
      document.querySelectorAll('[data-logout]').forEach(function (b) {
        b.addEventListener('click', function () { firebase.auth().signOut(); });
      });
    });
  });
})();
</script>

    <div>
      <span class="section-kicker">KORA CHALLENGE</span>
      <h2>الإعدادات <svg class="kico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3" /></svg></h2>

<main class="p90">

  <!-- ===== شاشة البداية ===== -->
  <section class="p90-panel p90-intro" id="p90Intro">
    <span class="section-kicker">تحدي السرعة</span>
    <h1>تحدي ال <span>90</span></h1>

    <button type="button" class="btn btn-primary p90-start" id="p90Start">
      ابدأ
      <svg class="svg-icon small-icon" aria-hidden="true"><use href="#icon-arrow"></use></svg>
    </button>

    <p class="p90-faded">كم تقدر تجيب لاعبين في 90 ثانية</p>
  </section>

  <!-- ===== شاشة اللعب ===== -->
  <section class="p90-panel p90-play" id="p90Play" hidden>

    <div class="p90-stage">
      <div class="p90-photo" id="p90Photo">
        <img id="p90Img" alt="صورة اللاعب" draggable="false">
        <div class="p90-loader" id="p90Loader" aria-live="polite">
          <span class="p90-spinner"></span>
          <small>بحمّل الصورة…</small>
        </div>
      </div>

      <aside class="p90-side">
        <div class="p90-timer" id="p90Timer" role="timer" aria-label="الوقت المتبقي">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="p90-ring-bg" cx="50" cy="50" r="44"></circle>
            <circle class="p90-ring" id="p90Ring" cx="50" cy="50" r="44"></circle>
          </svg>
          <span class="p90-time" id="p90Time">90</span>
        </div>

        <div class="p90-score">
          <strong id="p90Score">0</strong>
          <small>نقطة</small>
        </div>
      </aside>
    </div>

    <div class="p90-feedback" id="p90Feedback" aria-live="polite"></div>

    <form class="p90-answer" id="p90Form" autocomplete="off">
      <ul class="p90-suggest" id="p90Suggest" role="listbox" hidden></ul>

      <input
        type="text"
        id="p90Input"
        dir="auto"
        placeholder="اكتب اسم اللاعب (عربي أو English)"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="done"
        aria-label="اسم اللاعب"
        aria-autocomplete="list"
      >

      <button type="submit" class="p90-confirm" id="p90Confirm" disabled>
        تأكيد
      </button>
    </form>

    <button type="button" class="p90-skip" id="p90Skip">تخطي</button>
  </section>

  <!-- ===== شاشة النتيجة ===== -->
  <section class="p90-panel p90-result" id="p90Result" hidden>
    <span class="section-kicker" id="p90ResultKicker">انتهى الوقت</span>
    <div class="p90-big" id="p90ResultScore">0</div>
    <p class="p90-result-label" id="p90ResultLabel">لاعب في 90 ثانية</p>
    <p class="p90-best" id="p90Best"></p>

    <div class="p90-chips" id="p90Chips"></div>

    <div class="p90-result-actions">
      <button type="button" class="btn btn-primary" id="p90Again">
        العب تاني
        <svg class="svg-icon small-icon" aria-hidden="true"><use href="#icon-arrow"></use></svg>
      </button>
      <a href="index.html#games" class="btn btn-outline">الرئيسية</a>
    </div>
  </section>

</main>

<div class="toast" id="toast" role="status"></div>

</body>
