<!DOCTYPE html>
<html lang="ar" dir="rtl" class="auth-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d0b">
  <meta name="description" content="Kora Challenge - تحدي ال 90 - كام لاعب تقدر تجيب في 90 ثانية؟">
  <title>Kora Challenge | تحدي ال 90</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="players90.css">
<style>html.auth-pending body{visibility:hidden}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* حارس تسجيل الدخول: لو مفيش مستخدم مسجّل يرجّعك لصفحة login.html */
(function () {
  var CFG = {
    apiKey: "AIzaSyDEDLvC4wKI9_HX7WUG6th4zuUOwxxB54k",
    authDomain: "kora-e220c.firebaseapp.com",
    databaseURL: "https://kora-e220c-default-rtdb.firebaseio.com",
    projectId: "kora-e220c",
    storageBucket: "kora-e220c.firebasestorage.app",
    messagingSenderId: "535044321885",
    appId: "1:535044321885:web:b89615d5eb01a93e1613b4"
  };
  window.KoraAuth = { user: null };

  function toLogin() {
    var p = location.pathname.split('/').pop();
    location.replace('login.html' + (p && p !== 'index.html' ? '?next=' + encodeURIComponent(p) : ''));
  }
  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  }

  try {
    if (!firebase.apps.length) firebase.initializeApp(CFG);
  } catch (e) { toLogin(); return; }

  var timer = setTimeout(toLogin, 10000);
  firebase.auth().onAuthStateChanged(function (u) {
    clearTimeout(timer);
    if (!u) { toLogin(); return; }
    window.KoraAuth.user = u;
    document.documentElement.classList.remove('auth-pending');
    ready(function () {
      var name = u.displayName || (u.email ? u.email.split('@')[0] : '') || 'لاعب';
      document.querySelectorAll('[data-user-name]').forEach(function (el) { el.textContent = name; });
      document.querySelectorAll('[data-logout]').forEach(function (b) {
        b.addEventListener('click', function () { firebase.auth().signOut(); });
      });
    });
  });
})();
</script>
</head>
<body>

<!-- SVG Icons -->
<svg xmlns="http://www.w3.org/2000/svg"
     style="position:absolute;width:0;height:0;overflow:hidden"
     aria-hidden="true">

  <symbol id="icon-ball" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-width="4"/>
    <path d="m32 18 11 8-4 13H25l-4-13Z" fill="currentColor"/>
    <path d="m32 18-1-12M43 26l13-4M39 39l7 12M25 39l-7 12M21 26 8 22"
          fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-arrow" viewBox="0 0 24 24">
    <path d="M5 12h14m-6-6 6 6-6 6"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-bolt" viewBox="0 0 24 24">
    <path d="M13 2 4 13h7l-1 9 10-13h-7Z" fill="currentColor"/>
  </symbol>
</svg>


<header class="top">
  <button
    class="menu-toggle"
    id="menuToggle"
    type="button"
    aria-label="فتح القائمة"
    aria-controls="settingsPanel"
    aria-expanded="false"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 6h18M3 12h18M3 18h18"></path>
    </svg>
  </button>

  <div class="brand">
    <svg class="svg-icon brand-ball" aria-hidden="true">
      <use href="#icon-ball"></use>
    </svg>
    KORA <span>CHALLENGE</span>
  </div>

  <div class="header-actions">
    <button
      class="settings-toggle"
      type="button"
      aria-label="الإعدادات"
      aria-expanded="false"
      aria-controls="settingsPanel"
      title="الإعدادات"
    >
      <svg viewBox="0 0 24 24" width="24" height="24"
        fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="m19.4 15 .1.1 1.4 1.1-1.5 2.6-1.7-.6a8 8 0 0 1-1.8 1l-.3 1.8h-3l-.3-1.8a8 8 0 0 1-1.8-1l-1.7.6-1.5-2.6L6.7 15a8 8 0 0 1 0-2l-1.4-1.1 1.5-2.6 1.7.6a8 8 0 0 1 1.8-1l.3-1.8h3l.3 1.8a8 8 0 0 1 1.8 1l1.7-.6 1.5 2.6-1.4 1.1a8 8 0 0 1 0 2Z"
          transform="translate(-1 -1) scale(1.08)"></path>
      </svg>
    </button>

    <a class="back home-icon" href="index.html"
      aria-label="الصفحة الرئيسية" title="الصفحة الرئيسية">
      <svg viewBox="0 0 24 24" width="25" height="25"
        fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">
        <path d="m3 10 9-7 9 7"></path>
        <path d="M5 9v12h14V9"></path>
        <path d="M9 21v-7h6v7"></path>
      </svg>
    </a>
  </div>
</header>

<div class="menu-overlay" id="menuOverlay"></div>

<aside class="menu-drawer" id="menuDrawer" aria-hidden="true">
  <div class="menu-drawer-header">
    <h2>القائمة</h2>
    <button id="menuClose" type="button" aria-label="إغلاق القائمة">×</button>
  </div>

  <button class="menu-item" id="openSettings" type="button">
    <span>⚙️</span>
    <span>الإعدادات</span>
    <span>←</span>
  </button>

  <a class="menu-item" href="index.html#games">
    <span>⚽</span>
    <span>الألعاب</span>
    <span>←</span>
  </a>
</aside>

<div class="settings-overlay" id="settingsOverlay"></div>

<aside class="settings-panel" id="settingsPanel"
  aria-label="إعدادات الموقع" aria-hidden="true">

  <div class="settings-heading">
    <div>
      <span class="section-kicker">KORA CHALLENGE</span>
      <h2>الإعدادات ⚙️</h2>
    </div>

    <button class="settings-close" id="settingsClose"
      type="button" aria-label="إغلاق الإعدادات">✕</button>
  </div>

  <div class="setting-group">
    <label for="languageSelect">🌐 لغة الموقع</label>
    <select id="languageSelect">
      <option value="en">🇬🇧 English</option>
      <option value="ar" selected>🇪🇬 العربية</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="ku">🟩 کوردی</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="es">🇪🇸 Español</option>
    </select>
  </div>

  <div class="setting-group">
    <label>🎨 مظهر الموقع</label>

    <div class="theme-options">
      <button class="theme-option active"
        id="themeDark" type="button" data-theme="dark"
        aria-pressed="true">
        <span>🌙</span>
        <span>داكن</span>
      </button>

      <button class="theme-option"
        id="themeLight" type="button" data-theme="light"
        aria-pressed="false">
        <span>☀️</span>
        <span>فاتح</span>
      </button>
    </div>
  </div>

  <p class="settings-note">
    اختار اللغة والمظهر اللي يناسبك.
    اختياراتك هتتخزن على جهازك.
  </p>
</aside>


<main class="p90">

  <!-- ===== شاشة البداية ===== -->
  <section class="p90-panel p90-intro" id="p90Intro">
    <span class="section-kicker">تحدي السرعة</span>
    <h1>تحدي ال <span>90</span></h1>

    <button type="button" class="btn btn-primary p90-start" id="p90Start">
      ابدأ
      <svg class="svg-icon small-icon" aria-hidden="true"><use href="#icon-arrow"></use></svg>
    </button>

    <p class="p90-faded">كم تقدر تجيب لاعبين في 90 ثانية</p>
  </section>

  <!-- ===== شاشة اللعب ===== -->
  <section class="p90-panel p90-play" id="p90Play" hidden>

    <div class="p90-stage">
      <div class="p90-photo" id="p90Photo">
        <img id="p90Img" alt="صورة اللاعب" draggable="false">
        <div class="p90-loader" id="p90Loader" aria-live="polite">
          <span class="p90-spinner"></span>
          <small>بحمّل الصورة…</small>
        </div>
      </div>

      <aside class="p90-side">
        <div class="p90-timer" id="p90Timer" role="timer" aria-label="الوقت المتبقي">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="p90-ring-bg" cx="50" cy="50" r="44"></circle>
            <circle class="p90-ring" id="p90Ring" cx="50" cy="50" r="44"></circle>
          </svg>
          <span class="p90-time" id="p90Time">90</span>
        </div>

        <div class="p90-score">
          <strong id="p90Score">0</strong>
          <small>صح</small>
        </div>
      </aside>
    </div>

    <div class="p90-feedback" id="p90Feedback" aria-live="polite"></div>

    <form class="p90-answer" id="p90Form" autocomplete="off">
      <ul class="p90-suggest" id="p90Suggest" role="listbox" hidden></ul>

      <input
        type="text"
        id="p90Input"
        dir="auto"
        placeholder="اكتب اسم اللاعب (عربي أو English)"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="done"
        aria-label="اسم اللاعب"
        aria-autocomplete="list"
      >

      <button type="submit" class="p90-confirm" id="p90Confirm" disabled>
        تأكيد
      </button>
    </form>

    <button type="button" class="p90-skip" id="p90Skip">تخطي</button>
  </section>

  <!-- ===== شاشة النتيجة ===== -->
  <section class="p90-panel p90-result" id="p90Result" hidden>
    <span class="section-kicker" id="p90ResultKicker">انتهى الوقت</span>
    <div class="p90-big" id="p90ResultScore">0</div>
    <p class="p90-result-label" id="p90ResultLabel">لاعب في 90 ثانية</p>
    <p class="p90-best" id="p90Best"></p>

    <div class="p90-chips" id="p90Chips"></div>

    <div class="p90-result-actions">
      <button type="button" class="btn btn-primary" id="p90Again">
        العب تاني
        <svg class="svg-icon small-icon" aria-hidden="true"><use href="#icon-arrow"></use></svg>
      </button>
      <a href="index.html#games" class="btn btn-outline">الرئيسية</a>
    </div>
  </section>

</main>

<div class="toast" id="toast" role="status"></div>

<script src="script.js"></script>
<script src="players90.js"></script>

</body>
</html>
